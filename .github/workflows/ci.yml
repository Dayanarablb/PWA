name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del Backend
        working-directory: ./practica-u3
        run: npm install

      - name: Instalar dependencias del Frontend
        working-directory: ./practica-react
        run: npm install

      - name: Construir la aplicación Frontend
        working-directory: ./practica-react
        run: npm run build

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen Backend
        working-directory: ./practica-u3
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-api:latest

      - name: Construir y publicar imagen Frontend
        working-directory: ./practica-react
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-react:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-react:latest
